[package]
name = "now-boarding"
version = "0.1.0"
edition.workspace = true
description = "A live airport and railway departures board, drawn with split-flap cards"
publish = false

[[bin]]
name = "now-boarding"
path = "src/main.rs"

[dependencies]
splitflap = { path = "../splitflap" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The network: blocking HTTPS with rustls, only ever on a poller's or a
# Settings task's own thread.
ureq = { version = "3", default-features = false, features = ["rustls"] }
hmac = "0.12"
# Logos the user adds, for personal use: PNG only.
image = { version = "0.25", default-features = false, features = ["png"] }
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
ron = "0.12"
